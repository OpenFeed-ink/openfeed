name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]   # PRs to main → test only
  push:
    branches: [production]  # production → deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check || echo "No type-check script"

      - name: Build Test
        run: npm run build
        env:
          NEXT_PUBLIC_PADDLE_ENV: ${{ secrets.NEXT_PUBLIC_PADDLE_ENV }}
          NEXT_PUBLIC_PADDLE_SUCCESSURL: ${{ secrets.NEXT_PUBLIC_PADDLE_SUCCESSURL }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_CUSTOMER_PORTAL_URL: ${{secrets.NEXT_PUBLIC_PADDLE_CUSTOMER_PORTAL_URL}}
          REDIS_URL: ${{secrets.REDIS_URL}}

  deploy:
    # ONLY run on production pushes
    if: github.ref == 'refs/heads/production'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: |
          flyctl deploy --remote-only \
          --build-arg NEXT_PUBLIC_PADDLE_ENV=$NEXT_PUBLIC_PADDLE_ENV \
          --build-arg NEXT_PUBLIC_PADDLE_SUCCESSURL=$NEXT_PUBLIC_PADDLE_SUCCESSURL \
          --build-arg NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=$NEXT_PUBLIC_PADDLE_CLIENT_TOKEN \
          --build-arg NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID=$NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID \
          --build-arg NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID=$NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID \
          --build-arg NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID=$NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID \
          --build-arg NEXT_PUBLIC_PADDLE_CUSTOMER_PORTAL_URL=$NEXT_PUBLIC_PADDLE_CUSTOMER_PORTAL_URL \
          --build-arg REDIS_URL=$REDIS_URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_PADDLE_ENV: ${{ secrets.NEXT_PUBLIC_PADDLE_ENV }}
          NEXT_PUBLIC_PADDLE_SUCCESSURL: ${{ secrets.NEXT_PUBLIC_PADDLE_SUCCESSURL }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_CUSTOMER_PORTAL_URL: ${{ secrets.NEXT_PUBLIC_PADDLE_CUSTOMER_PORTAL_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
