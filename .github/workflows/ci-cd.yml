name: CI/CD Pipeline

on:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      # 3. Install dependencies
      - name: Install deps
        run: npm ci

      # 4. Lint
      - name: Run lint
        run: npm run lint

      # 5. Build (IMPORTANT: inject env here too)
      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_PADDLE_ENV: ${{ secrets.NEXT_PUBLIC_PADDLE_ENV }}
          NEXT_PUBLIC_PADDLE_SUCCESSURL: ${{ secrets.NEXT_PUBLIC_PADDLE_SUCCESSURL }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID }}
          NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID: ${{ secrets.NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID }}

      # 6. Setup Fly CLI
      - name: Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 7. Deploy (with build args!)
      - name: Deploy to Fly
        run: |
          flyctl deploy \
            --build-arg NEXT_PUBLIC_PADDLE_ENV=${{ secrets.NEXT_PUBLIC_PADDLE_ENV }} \
            --build-arg NEXT_PUBLIC_PADDLE_SUCCESSURL=${{ secrets.NEXT_PUBLIC_PADDLE_SUCCESSURL }} \
            --build-arg NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }} \
            --build-arg NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID=${{ secrets.NEXT_PUBLIC_PADDLE_SCALE_PRICE_ID }} \
            --build-arg NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID=${{ secrets.NEXT_PUBLIC_PADDLE_GROWTH_PRICE_ID }} \
            --build-arg NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID=${{ secrets.NEXT_PUBLIC_PADDLE_STARTER_PRICE_ID }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
