name: Build & Push Docker (Version Branch)

on:
  push:
    branches:
      - 'v*.*.*'   # matches v0.1.0, v1.2.3, etc

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker image
        run: |
          VERSION=${{ steps.version.outputs.version }}

          echo "Building version: $VERSION"

          docker build -t ghcr.io/openfeed-ink/openfeed:$VERSION .
          docker push ghcr.io/openfeed-ink/openfeed:$VERSION

          docker tag ghcr.io/openfeed-ink/openfeed:$VERSION ghcr.io/openfeed-ink/openfeed:latest
          docker push ghcr.io/openfeed-ink/openfeed:latest

      - name: Logout
        run: docker logout ghcr.io
