# fly.toml app configuration file generated for openfeed on 2026-03-28T05:46:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openfeed'
primary_region = 'fra'

[build]

[deploy]
  # Runs once, to completion, on a fresh machine using the new image before
  # any machine running the new version starts serving traffic — Fly's
  # standard pattern for schema migrations. Previously nothing ran
  # migrations at all: migrateToLatest() existed in db/index.ts but was
  # never called anywhere.
  release_command = "node scripts/migrate.mjs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Was 0 — every idle period (as short as ~7-10 min under real traffic)
  # let Fly scale to zero machines, so the next visitor (or widget embed
  # on an external site, which is exactly this bursty/infrequent pattern)
  # paid a cold Firecracker boot. That boot sometimes took long enough
  # that the proxy gave up and started a *second* cold machine instead of
  # waiting, stacking two boot cycles into one request — this is what
  # produced the ~20s+ load times, not app code being slow. Keeping one
  # machine always warm removes cold starts for normal traffic entirely.
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
