# fly.toml app configuration file generated for openfeed on 2026-03-28T05:46:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openfeed'
primary_region = 'fra'

[build]

[deploy]
  # Runs once, to completion, on a fresh machine using the new image before
  # any machine running the new version starts serving traffic — Fly's
  # standard pattern for schema migrations. Previously nothing ran
  # migrations at all: migrateToLatest() existed in db/index.ts but was
  # never called anywhere.
  release_command = "node scripts/migrate.mjs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Deliberately 0: cost matters more than eliminating the occasional cold
  # start, so a machine is allowed to fully stop when idle instead of
  # staying warm around the clock.
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    # Was 10s, which sat right at the ~8s it actually takes this app to
    # boot on a shared-cpu-1x machine — close enough that the proxy
    # sometimes gave up waiting on a legitimately-booting machine and
    # started a second one instead ("gave up after 15 attempts (8.03s)"
    # in the logs, then a fresh cold boot on top of the one already in
    # progress). Widened so a normal cold start has room to finish before
    # the proxy loses patience with it.
    grace_period = "25s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
